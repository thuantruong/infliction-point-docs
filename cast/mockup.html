<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cast Receiver Mockup</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="receiver.css">
  <style>
    /* Mockup controls overlay */
    #controls {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #controls-panel {
      background: rgba(0,0,0,0.85);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.6rem;
      padding: 1rem 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      font-family: 'Manrope', sans-serif;
      font-size: 0.8rem;
      color: rgba(255,255,255,0.7);
      min-width: 200px;
    }
    #controls-panel label {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.8rem;
    }
    #controls-panel select, #controls-panel input[type=range], #controls-panel input[type=text], #controls-panel input[type=number] {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.3rem;
      color: #fff;
      padding: 0.2rem 0.4rem;
      font-size: 0.75rem;
      cursor: pointer;
    }
    #controls-panel input[type=text], #controls-panel input[type=number] {
      width: 11rem;
      cursor: text;
    }
    #controls-panel input[type=checkbox] { cursor: pointer; }
    .slide-row {
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-bottom: 0.3rem;
    }
    .slide-row input.slide-src { flex: 1; width: auto; }
    .slide-row input.slide-dur { width: 3.5rem; }
    .slide-row button {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.3rem;
      color: #fff;
      cursor: pointer;
      padding: 0.2rem 0.45rem;
    }
    #btn-add-slide {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.3rem;
      color: #fff;
      cursor: pointer;
      padding: 0.3rem 0.5rem;
      font-size: 0.75rem;
    }
    .ctrl-sep {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 0.2rem 0;
    }
    #toggle-btn {
      background: #D5FB28;
      color: #0a0a0a;
      border: none;
      border-radius: 0.4rem;
      padding: 0.4rem 0.9rem;
      font-family: 'Manrope', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      align-self: flex-end;
    }
    #btn-export {
      background: transparent;
      color: #D5FB28;
      border: 1px solid #D5FB28;
      border-radius: 0.4rem;
      padding: 0.35rem 0.9rem;
      font-family: 'Manrope', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      width: 100%;
    }
    #btn-preview {
      background: transparent;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 0.4rem;
      padding: 0.35rem 0.9rem;
      font-family: 'Manrope', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      letter-spacing: 0.05em;
      width: 100%;
    }
    #slideshow-preview {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: black;
      cursor: pointer;
    }
    #slideshow-preview #slide-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      position: absolute;
      top: 0;
      left: 0;
      background: black;
    }
    #slideshow-preview-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      color: rgba(255,255,255,0.6);
      font-family: 'Manrope', sans-serif;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <!-- Slideshow preview overlay -->
  <div id="slideshow-preview" class="hidden">
    <div id="slideshow">
      <img id="slide-img-a" class="slide-img">
      <img id="slide-img-b" class="slide-img">
      <video id="slide-video" class="hidden" muted playsinline></video>
    </div>
    <div id="slideshow-preview-hint">Click to stop preview</div>
  </div>

  <!-- Default (split-panel) theme -->
  <div id="scoreboard" class="hidden">
    <div id="team1" class="team-panel team1-bg">
      <div id="serve1" class="serve-ball"></div>
      <div id="score-container1" class="score-container">
        <div id="points1" class="points">40</div>
      </div>
      <div id="medal1" class="medal hidden"><img src="trophy.svg" class="trophy-img"></div>
      <div id="label1" class="team-label-pill team1-pill">Benjamin / Tison</div>
    </div>
    <div id="badge" class="badge hidden">TIEBREAK</div>
    <div id="center-overlay">
      <div id="dots-row" class="dots-row"></div>
      <div id="format-label" class="format-label">CLASSIC (3 SETS)</div>
      <div id="score-row-1" class="score-row large">
        <span class="score-team1">1</span>
        <span class="score-separator">·</span>
        <span class="score-team2">0</span>
      </div>
      <div id="score-row-label" class="score-row-label">Games to 5</div>
      <div id="score-row-2" class="score-row large">
        <span class="score-team1">3</span>
        <span class="score-separator">·</span>
        <span class="score-team2">2</span>
      </div>
      <div id="duration" class="duration-label">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="duration-icon" fill="currentColor">
          <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-20-420v-200h80v160h160v80H460Z"/>
        </svg>
        <span>3:45 PM</span>
        <span class="duration-separator">·</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="duration-icon" fill="currentColor">
          <path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm-99.5 291.5Q275-137 226-186t-77.5-114.5Q120-366 120-440t28.5-139.5Q177-645 226-694t114.5-77.5Q406-800 480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80q-74 0-139.5-28.5ZM678-242q82-82 82-198t-82-198q-82-82-198-82t-198 82q-82 82-82 198t82 198q82 82 198 82t198-82ZM480-440Z"/>
        </svg>
        <span>0:47</span>
      </div>
    </div>
    <div id="team2" class="team-panel team2-bg">
      <div id="serve2" class="serve-ball hidden"></div>
      <div id="score-container2" class="score-container">
        <div id="points2" class="points">15</div>
      </div>
      <div id="medal2" class="medal hidden"><img src="trophy.svg" class="trophy-img"></div>
      <div id="label2" class="team-label-pill team2-pill">Teodoro / Zapata</div>
    </div>
  </div>

  <!-- Broadcast theme -->
  <div id="scoreboard-broadcast" class="hidden">
    <div class="bc-bg-image"></div>
    <div class="bc-bg-overlay"></div>
    <div class="bc-layout">
      <div class="bc-top-row">
        <div id="bc-header" class="bc-header">
          <span id="bc-title" class="bc-title">Premier Padel Championship</span>
        </div>
        <div id="bc-duration" class="bc-duration">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="bc-duration-icon" fill="currentColor">
            <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-20-420v-200h80v160h160v80H460Z"/>
          </svg>
          <span>3:45 PM</span>
          <span class="bc-duration-separator">·</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="bc-duration-icon" fill="currentColor">
            <path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm-99.5 291.5Q275-137 226-186t-77.5-114.5Q120-366 120-440t28.5-139.5Q177-645 226-694t114.5-77.5Q406-800 480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80q-74 0-139.5-28.5ZM678-242q82-82 82-198t-82-198q-82-82-198-82t-198 82q-82 82-82 198t82 198q82 82 198 82t198-82ZM480-440Z"/>
          </svg>
          <span id="bc-duration-text">0:47</span>
        </div>
      </div>
      <div class="bc-table-wrapper">
      <div class="bc-table">
        <div class="bc-col-header-row">
          <div class="bc-name-header" id="bc-col-label">Quarter-Finals</div>
          <div id="bc-set-headers" class="bc-set-headers"></div>
          <div id="bc-point-header" class="bc-point-header">POINT</div>
        </div>
        <div class="bc-divider"></div>
        <div class="bc-row">
          <div id="bc-strip1" class="bc-team-strip team1"></div>
          <div id="bc-names1" class="bc-names-cell"></div>
          <div id="bc-serve1" class="bc-serve-ball"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69.447 69.447"><path fill="var(--bc-accent-color, #D5FB28)" d="M69.439,34.724a34.719,34.719 0,1 1,-34.72 -34.724A34.724,34.724 0,0 1,69.439 34.724Z"/><path fill="#F7F7F7" d="M39.375,0.345a35.139,35.139 0,0 0,-4.61 -0.344,41.069 41.069,0 0,1 -34.369,29.735 34.3,34.3 0,0 0,-0.381 4.635l0.183,-0.026A45.921,45.921 0,0 0,39.347 0.464ZM69.096,35.037a45.487,45.487 0,0 0,-33.488 34.054l-0.071,0.313a34.54,34.54 0,0 0,4.818 -0.455,41.218 41.218,0 0,1 28.686,-29.194 36.059,36.059 0,0 0,0.388 -4.8Z"/></svg></div>
          <div id="bc-sets1" class="bc-sets-cell"></div>
          <div id="bc-point-cell1" class="bc-point-cell serving">
            <div class="bc-trophy hidden"><img src="trophy.svg" class="trophy-img"></div>
            <div id="bc-star1" class="bc-star hidden">★</div>
            <span class="bc-points">40</span>
          </div>
        </div>
        <div class="bc-divider"></div>
        <div class="bc-row">
          <div id="bc-strip2" class="bc-team-strip team2"></div>
          <div id="bc-names2" class="bc-names-cell"></div>
          <div id="bc-serve2" class="bc-serve-ball hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69.447 69.447"><path fill="var(--bc-accent-color, #D5FB28)" d="M69.439,34.724a34.719,34.719 0,1 1,-34.72 -34.724A34.724,34.724 0,0 1,69.439 34.724Z"/><path fill="#F7F7F7" d="M39.375,0.345a35.139,35.139 0,0 0,-4.61 -0.344,41.069 41.069,0 0,1 -34.369,29.735 34.3,34.3 0,0 0,-0.381 4.635l0.183,-0.026A45.921,45.921 0,0 0,39.347 0.464ZM69.096,35.037a45.487,45.487 0,0 0,-33.488 34.054l-0.071,0.313a34.54,34.54 0,0 0,4.818 -0.455,41.218 41.218,0 0,1 28.686,-29.194 36.059,36.059 0,0 0,0.388 -4.8Z"/></svg></div>
          <div id="bc-sets2" class="bc-sets-cell"></div>
          <div id="bc-point-cell2" class="bc-point-cell">
            <div class="bc-trophy hidden"><img src="trophy.svg" class="trophy-img"></div>
            <div id="bc-star2" class="bc-star hidden">★</div>
            <span class="bc-points">15</span>
          </div>
        </div>
        <div class="bc-divider"></div>
      </div>
      <div id="bc-badge" class="bc-badge hidden"></div>
      </div>
    </div>
  </div>

  <!-- VS Preview -->
  <div id="vs-screen" class="hidden">
    <div id="vs-default-layout" class="hidden">
      <div class="vs-panel vs-panel-team1">
        <div id="vs-names1-default" class="vs-names"></div>
      </div>
      <div class="vs-center-default">
        <span class="vs-label-default">VS</span>
      </div>
      <div class="vs-center-ad hidden">
        <img id="vs-ad-a" class="vs-ad-img">
        <img id="vs-ad-b" class="vs-ad-img">
      </div>
      <div class="vs-panel vs-panel-team2">
        <div id="vs-names2-default" class="vs-names"></div>
      </div>
    </div>
    <div id="vs-broadcast-layout" class="hidden">
      <div class="bc-bg-image"></div>
      <div class="bc-bg-overlay"></div>
      <div class="vs-bc-outer">
        <div class="vs-bc-ad hidden">
          <img id="vs-ad-bc-a" class="vs-ad-img">
          <img id="vs-ad-bc-b" class="vs-ad-img">
        </div>
        <div id="vs-bc-header" class="bc-header hidden">
          <span id="vs-bc-title" class="bc-title"></span>
          <span id="vs-bc-subtitle" class="vs-bc-subtitle"></span>
        </div>
        <div class="vs-bc-layout">
          <div class="vs-bc-team">
            <div class="bc-team-strip team1"></div>
            <div id="vs-names1-broadcast" class="vs-bc-names"></div>
          </div>
          <div class="vs-bc-vs">VS</div>
          <div class="vs-bc-team">
            <div class="bc-team-strip team2"></div>
            <div id="vs-names2-broadcast" class="vs-bc-names"></div>
          </div>
        </div>
      </div>
    </div>
    <div id="vs-countdown" class="vs-countdown hidden">
      <span class="vs-countdown-label">STARTS IN</span>
      <span id="vs-countdown-time" class="vs-countdown-time">--:--</span>
    </div>
  </div>

  <!-- Controls -->
  <div id="controls">
    <div id="controls-panel">
      <label>Theme
        <select id="sel-theme">
          <option value="broadcast">Broadcast</option>
          <option value="default">Default (split)</option>
        </select>
      </label>
      <div class="ctrl-sep"></div>
      <label>Format
        <select id="sel-format">
          <option value="classic3">Classic 3 sets</option>
          <option value="classic2mtb">Classic 2 sets + Super TB</option>
          <option value="classic1">Classic 1 set</option>
          <option value="total">Total Games</option>
          <option value="fixed">Fixed Point</option>
        </select>
      </label>
      <label>Serving
        <select id="sel-serve">
          <option value="1">Team 1</option>
          <option value="2">Team 2</option>
        </select>
      </label>
      <label>Point
        <select id="sel-point">
          <option value="0/15">0 / 15</option>
          <option value="15/30">15 / 30</option>
          <option value="30/40">30 / 40</option>
          <option value="40/15" selected>40 / 15</option>
          <option value="AD/-">AD / –</option>
          <option value="40/40">Deuce (40/40)</option>
          <option value="★/★">Star Point</option>
        </select>
      </label>
      <div class="ctrl-sep"></div>
      <label>Match state
        <select id="sel-state">
          <option value="live">Live</option>
          <option value="won1">Team 1 won</option>
          <option value="won2">Team 2 won</option>
          <option value="draw">Draw</option>
          <option value="vs">VS Preview</option>
        </select>
      </label>
      <div class="ctrl-sep"></div>
      <label>Title bar <input type="checkbox" id="chk-title" checked></label>
      <label>Title
        <input type="text" id="inp-title" value="Premier Padel Championship">
      </label>
      <label>Subtitle
        <input type="text" id="inp-subtitle" value="Quarter-Finals">
      </label>
      <div class="ctrl-sep"></div>
      <label>BG image URL
        <input type="text" id="inp-bg-url" placeholder="(none)">
      </label>
      <label>Overlay color
        <input type="text" id="inp-bg-color" placeholder="rgba(0,0,0,0.6)">
      </label>
      <label>Scoreboard bg
        <input type="text" id="inp-sb-color" placeholder="rgba(15,15,15,0.85)">
      </label>
      <label>Text color
        <input type="text" id="inp-text-color" placeholder="#FFFFFF">
      </label>
      <label>Accent color
        <input type="text" id="inp-accent-color" placeholder="#D5FB28">
      </label>
      <label>Slideshow bg
        <input type="text" id="inp-slide-bg" placeholder="black">
      </label>
      <div class="ctrl-sep"></div>
      <label>Slideshow after match (min)
        <input type="number" id="inp-match-delay" min="0" placeholder="0">
      </label>
      <label>VS countdown (min)
        <input type="number" id="inp-vs-countdown" min="0" step="0.5" placeholder="0">
      </label>
      <div class="ctrl-sep"></div>
      <label>Slides</label>
      <div id="slides-editor"></div>
      <button id="btn-add-slide" type="button">Add slide</button>
      <button id="btn-preview" type="button">Preview slideshow</button>
      <div class="ctrl-sep"></div>
      <button id="btn-export">Export playlist.json</button>
    </div>
    <button id="toggle-btn" onclick="document.getElementById('controls-panel').style.display = document.getElementById('controls-panel').style.display === 'none' ? '' : 'none'">Controls</button>
  </div>

<script>
'use strict';

// --- Mock data ---

var TEAMS = [
  { names: ['Benjamin Tison', 'Agustin Tapia'] },
  { names: ['Teodoro Zapata', 'Paquito Navarro'] }
];

var FORMATS = {
  classic3: {
    label: 'CLASSIC (3 SETS)',
    sets: [
      { g1: 6, g2: 4, winner: 'TEAM_1' },
      { g1: 4, g2: 6, winner: 'TEAM_2' },
      { g1: 3, g2: 2, winner: null }
    ],
    bestOfSets: 3,
    currentSet: 2
  },
  classic2mtb: {
    label: 'CLASSIC (2 SETS)',
    sets: [
      { g1: 6, g2: 4, winner: 'TEAM_1' },
      { g1: 3, g2: 6, winner: 'TEAM_2' },
      { g1: 11, g2: 9, winner: 'TEAM_1', mtb: true }
    ],
    bestOfSets: 2,
    currentSet: 2
  },
  classic1: {
    label: 'GAMES (5)',
    sets: [{ g1: 3, g2: 2, winner: null }],
    bestOfSets: 1,
    currentSet: 0
  },
  total: {
    label: 'TOTAL GAMES',
    sets: [
      { g1: 1, g2: 0, winner: 'TEAM_1' },
      { g1: 0, g2: 1, winner: 'TEAM_2' },
      { g1: 1, g2: 0, winner: 'TEAM_1' },
      { g1: 0, g2: 0, winner: null }
    ],
    bestOfSets: null,
    currentSet: 3,
    totalGames: 6
  },
  fixed: {
    label: '21 POINTS',
    sets: [{ g1: 11, g2: 9, winner: null }],
    bestOfSets: null,
    currentSet: 0
  }
};

// --- Element refs (broadcast) ---

var bcNames1 = document.getElementById('bc-names1');
var bcNames2 = document.getElementById('bc-names2');
var bcSets1 = document.getElementById('bc-sets1');
var bcSets2 = document.getElementById('bc-sets2');
var bcSetHeaders = document.getElementById('bc-set-headers');
var bcPointCell1 = document.getElementById('bc-point-cell1');
var bcPointCell2 = document.getElementById('bc-point-cell2');
var bcBadge = document.getElementById('bc-badge');
var bcBroadcast = document.getElementById('scoreboard-broadcast');
var bcHeader = document.getElementById('bc-header');

// --- Render ---

function renderNames(el, names) {
  el.innerHTML = '';
  names.forEach(function(n) {
    var d = document.createElement('div');
    d.className = 'bc-name';
    d.textContent = n;
    el.appendChild(d);
  });
}

function renderSetCols(fmt, fmtKey, matchWinner) {
  bcSetHeaders.innerHTML = '';
  bcSets1.innerHTML = '';
  bcSets2.innerHTML = '';

  function hdr(t) {
    var el = document.createElement('div');
    el.className = 'bc-set-header-cell';
    el.textContent = t;
    bcSetHeaders.appendChild(el);
  }
  function score(container, val, cls) {
    var el = document.createElement('div');
    el.className = 'bc-set-score' + (cls ? ' ' + cls : '');
    el.textContent = val;
    container.appendChild(el);
  }

  if (fmtKey === 'fixed') return;

  if (fmtKey === 'classic3' || fmtKey === 'classic2mtb') {
    fmt.sets.forEach(function(s, i) {
      hdr('Set ' + (i + 1));
      var effectiveWinner = s.winner || (matchWinner && i === fmt.currentSet ? matchWinner : null);
      var cls1 = effectiveWinner ? (effectiveWinner === 'TEAM_1' ? 'won' : 'lost') : '';
      var cls2 = effectiveWinner ? (effectiveWinner === 'TEAM_2' ? 'won' : 'lost') : '';
      var g1, g2;
      if (s.mtb) {
        g1 = s.winner === 'TEAM_1' ? 1 : 0;
        g2 = s.winner === 'TEAM_2' ? 1 : 0;
      } else {
        g1 = s.g1;
        g2 = s.g2;
      }
      score(bcSets1, g1, cls1);
      score(bcSets2, g2, cls2);
    });
  } else {
    hdr('GAMES');
    var g1 = fmt.sets.reduce(function(s,x){return s+x.g1;},0);
    var g2 = fmt.sets.reduce(function(s,x){return s+x.g2;},0);
    var cls1 = matchWinner ? (matchWinner === 'TEAM_1' ? 'won' : 'lost') : '';
    var cls2 = matchWinner ? (matchWinner === 'TEAM_2' ? 'won' : 'lost') : '';
    score(bcSets1, g1, cls1);
    score(bcSets2, g2, cls2);
  }
}

function getPointTexts() {
  var sel = document.getElementById('sel-point').value;
  var parts = sel.split('/');
  return [parts[0].trim(), parts[1].trim()];
}

function getServingTeam() {
  return parseInt(document.getElementById('sel-serve').value);
}

function update() {
  var theme = document.getElementById('sel-theme').value;
  var fmtKey = document.getElementById('sel-format').value;
  var state = document.getElementById('sel-state').value;
  var showTitle = document.getElementById('chk-title').checked;
  var titleVal = document.getElementById('inp-title').value;
  var subtitleVal = document.getElementById('inp-subtitle').value;
  var bgUrl = document.getElementById('inp-bg-url').value.trim();
  var bgColorVal = document.getElementById('inp-bg-color').value.trim();
  var sbColorVal = document.getElementById('inp-sb-color').value.trim();
  var textColorVal = document.getElementById('inp-text-color').value.trim();
  var accentColorVal = document.getElementById('inp-accent-color').value.trim();
  stopVsSim();
  var fmt = FORMATS[fmtKey];

  var scoreboardDefault = document.getElementById('scoreboard');
  var vsScreen = document.getElementById('vs-screen');
  var vsDefaultLayout = document.getElementById('vs-default-layout');
  var vsBroadcastLayout = document.getElementById('vs-broadcast-layout');
  var mockBg = bgUrl ? "url('" + bgUrl + "')" : 'none';

  // VS Preview state — works for both themes
  if (state === 'vs') {
    scoreboardDefault.classList.add('hidden');
    bcBroadcast.classList.add('hidden');
    vsScreen.classList.remove('hidden');
    // Ad mode always uses the split-theme design (side rails + center ad), even for broadcast.
    var adMode = Number(document.getElementById('inp-vs-countdown').value) > 0;
    var isBc = (theme === 'broadcast') && !adMode;
    vsDefaultLayout.classList.toggle('hidden', isBc);
    vsBroadcastLayout.classList.toggle('hidden', !isBc);
    function renderVsNames(el, names, cls) {
      el.innerHTML = '';
      names.split(' / ').forEach(function(n) {
        var d = document.createElement('div'); d.className = cls; d.textContent = n; el.appendChild(d);
      });
    }
    renderVsNames(document.getElementById('vs-names1-default'), TEAMS[0].names.join(' / '), 'vs-name');
    renderVsNames(document.getElementById('vs-names2-default'), TEAMS[1].names.join(' / '), 'vs-name');
    renderVsNames(document.getElementById('vs-names1-broadcast'), TEAMS[0].names.join(' / '), 'bc-name');
    renderVsNames(document.getElementById('vs-names2-broadcast'), TEAMS[1].names.join(' / '), 'bc-name');
    if (isBc) {
      var vsBgLayer = vsBroadcastLayout.querySelector('.bc-bg-image');
      if (vsBgLayer) {
        if (!bgUrl || bgUrl === 'none') {
          vsBgLayer.classList.remove('loaded');
          vsBgLayer.style.backgroundImage = 'none';
        } else {
          vsBgLayer.classList.remove('loaded');
          vsBgLayer.style.backgroundImage = mockBg;
          requestAnimationFrame(function() { vsBgLayer.classList.add('loaded'); });
        }
      }
      var vsOverlay = vsBroadcastLayout.querySelector('.bc-bg-overlay');
      if (vsOverlay) vsOverlay.style.background = bgColorVal || '';
      if (textColorVal) vsBroadcastLayout.style.setProperty('--bc-text-color', textColorVal);
      else vsBroadcastLayout.style.removeProperty('--bc-text-color');
      if (accentColorVal) vsBroadcastLayout.style.setProperty('--bc-accent-color', accentColorVal);
      else vsBroadcastLayout.style.removeProperty('--bc-accent-color');
      var vsLayout = vsBroadcastLayout.querySelector('.vs-bc-layout');
      if (vsLayout) vsLayout.style.background = sbColorVal || '';
      var vsBcHeader = document.getElementById('vs-bc-header');
      if (showTitle) {
        document.getElementById('vs-bc-title').textContent = titleVal;
        document.getElementById('vs-bc-subtitle').textContent = subtitleVal;
        vsBcHeader.classList.remove('hidden');
      } else {
        vsBcHeader.classList.add('hidden');
      }
    }
    startVsSim(false);
    // Broadcast theme: line-beside-name rails instead of solid team-color fill.
    vsDefaultLayout.classList.toggle('bc-rails', adMode && theme === 'broadcast');
    // Player rails, countdown bar, and ad slot (incl. letterbox) use the slideshow bg color in ad mode.
    var slideBg = adMode ? (document.getElementById('inp-slide-bg').value.trim() || 'black') : '';
    vsScreen.style.background = slideBg;
    document.getElementById('vs-countdown').style.background = slideBg;
    ['vs-ad-a','vs-ad-b','vs-ad-bc-a','vs-ad-bc-b'].forEach(function(id) {
      var el = document.getElementById(id); if (el) el.style.background = slideBg;
    });
    [document.querySelector('.vs-center-ad'), document.querySelector('.vs-bc-ad')].forEach(function(el) {
      if (el) el.style.background = slideBg;
    });
    // Countdown text + bar line use the configured accent color.
    var cdAccent = adMode ? (document.getElementById('inp-accent-color').value.trim()) : '';
    var cdEl = document.getElementById('vs-countdown');
    if (cdAccent) cdEl.style.setProperty('--vs-accent', cdAccent);
    else cdEl.style.removeProperty('--vs-accent');
    return;
  }

  vsScreen.classList.add('hidden');

  // Toggle themes
  var isDefault = theme === 'default';
  scoreboardDefault.classList.toggle('hidden', !isDefault);
  bcBroadcast.classList.toggle('hidden', isDefault);

  // Default theme: update badge + points
  if (isDefault) {
    var defaultBadge = document.getElementById('badge');
    var pts1 = document.getElementById('points1');
    var pts2 = document.getElementById('points2');
    var med1 = document.getElementById('medal1');
    var med2 = document.getElementById('medal2');
    var sc1 = document.getElementById('score-container1');
    var sc2 = document.getElementById('score-container2');
    var sv1 = document.getElementById('serve1');
    var sv2 = document.getElementById('serve2');

    defaultBadge.classList.add('hidden');
    defaultBadge.textContent = '';
    med1.classList.add('hidden'); med2.classList.add('hidden');
    sc1.style.display = ''; sc2.style.display = '';

    var serving = getServingTeam();
    sv1.classList.toggle('hidden', serving !== 1);
    sv2.classList.toggle('hidden', serving !== 2);

    if (state === 'won1') {
      sc1.style.display = 'none';
      med1.classList.remove('hidden');
      pts2.textContent = '';
    } else if (state === 'won2') {
      sc2.style.display = 'none';
      med2.classList.remove('hidden');
      pts1.textContent = '';
    } else if (state === 'draw') {
      pts1.textContent = '—'; pts2.textContent = '—';
      defaultBadge.textContent = 'DRAW';
      defaultBadge.classList.remove('hidden');
    } else {
      var pointSel = document.getElementById('sel-point').value;
      if (pointSel === '★/★') {
        pts1.textContent = '★'; pts2.textContent = '★';
        defaultBadge.textContent = 'STAR POINT';
        defaultBadge.classList.remove('hidden');
      } else if (pointSel === '40/40') {
        pts1.textContent = '40'; pts2.textContent = '40';
        defaultBadge.textContent = 'DEUCE';
        defaultBadge.classList.remove('hidden');
      } else if (pointSel === 'AD/-') {
        pts1.textContent = 'AD'; pts2.textContent = '';
      } else {
        var p = pointSel.split('/');
        pts1.textContent = p[0].trim(); pts2.textContent = p[1].trim();
      }
    }
    return;
  }

  // Background
  var bcBgLayer = bcBroadcast.querySelector('.bc-bg-image');
  if (bcBgLayer) {
    if (!bgUrl || bgUrl === 'none') {
      bcBgLayer.classList.remove('loaded');
      bcBgLayer.style.backgroundImage = 'none';
    } else {
      bcBgLayer.classList.remove('loaded');
      bcBgLayer.style.backgroundImage = mockBg;
      requestAnimationFrame(function() { bcBgLayer.classList.add('loaded'); });
    }
  }
  var bcOverlay = bcBroadcast.querySelector('.bc-bg-overlay');
  if (bcOverlay) bcOverlay.style.background = bgColorVal || '';
  var bcTable = bcBroadcast.querySelector('.bc-table');
  if (bcTable) bcTable.style.background = sbColorVal || '';
  if (textColorVal) bcBroadcast.style.setProperty('--bc-text-color', textColorVal);
  else bcBroadcast.style.removeProperty('--bc-text-color');
  if (accentColorVal) bcBroadcast.style.setProperty('--bc-accent-color', accentColorVal);
  else bcBroadcast.style.removeProperty('--bc-accent-color');

  // Title bar
  bcHeader.classList.toggle('hidden', !showTitle);
  document.getElementById('bc-title').textContent = titleVal;
  document.getElementById('bc-col-label').textContent = showTitle ? subtitleVal : '';

  // Names + strips (row1 = team1, row2 = team2 in mockup — no swap control)
  renderNames(bcNames1, TEAMS[0].names);
  renderNames(bcNames2, TEAMS[1].names);
  document.getElementById('bc-strip1').className = 'bc-team-strip team1';
  document.getElementById('bc-strip2').className = 'bc-team-strip team2';

  // Set columns
  var matchWinner = state === 'won1' ? 'TEAM_1' : state === 'won2' ? 'TEAM_2' : null;
  renderSetCols(fmt, fmtKey, matchWinner);
  document.getElementById('bc-point-header').style.visibility = matchWinner ? 'hidden' : '';

  // Point cells — reset
  bcPointCell1.classList.remove('serving');
  bcPointCell2.classList.remove('serving');
  bcBadge.classList.add('hidden');
  bcBadge.textContent = '';

  var pts1el = bcPointCell1.querySelector('.bc-points');
  var pts2el = bcPointCell2.querySelector('.bc-points');
  var trophy1 = bcPointCell1.querySelector('.bc-trophy');
  var trophy2 = bcPointCell2.querySelector('.bc-trophy');
  pts1el.classList.remove('hidden', 'advantage');
  pts2el.classList.remove('hidden', 'advantage');
  document.getElementById('bc-star1').classList.add('hidden');
  document.getElementById('bc-star2').classList.add('hidden');
  trophy1.classList.add('hidden');
  trophy2.classList.add('hidden');
  document.getElementById('bc-serve1').classList.add('hidden');
  document.getElementById('bc-serve2').classList.add('hidden');

  if (state === 'won1') {
    pts1el.classList.add('hidden');
    trophy1.classList.remove('hidden');
    pts2el.textContent = '';
  } else if (state === 'won2') {
    pts2el.classList.add('hidden');
    trophy2.classList.remove('hidden');
    pts1el.textContent = '';
  } else if (state === 'draw') {
    pts1el.textContent = '\u2014';
    pts2el.textContent = '\u2014';
    bcBadge.textContent = 'DRAW';
    bcBadge.classList.remove('hidden');
  } else {
    var pointSel = document.getElementById('sel-point').value;
    var pts = pointSel.split('/');
    var p1 = pts[0].trim();
    var p2 = pts[1].trim();

    pts1el.classList.remove('advantage');
    pts2el.classList.remove('advantage');

    if (pointSel === '★/★') {
      pts1el.classList.add('hidden');
      pts2el.classList.add('hidden');
      document.getElementById('bc-star1').classList.remove('hidden');
      document.getElementById('bc-star2').classList.remove('hidden');
      bcBadge.textContent = 'STAR POINT';
      bcBadge.classList.remove('hidden');
    } else if (pointSel === '40/40') {
      p1 = '40'; p2 = '40';
      bcBadge.textContent = 'DEUCE';
      bcBadge.classList.remove('hidden');
    } else if (pointSel === 'AD/-') {
      p1 = 'AD'; p2 = '';
      pts1el.classList.add('advantage');
    }

    if (pointSel !== '★/★') {
      pts1el.textContent = p1;
      pts2el.textContent = p2;
    }

    var serving = getServingTeam();
    document.getElementById('bc-serve1').classList.toggle('hidden', serving !== 1);
    document.getElementById('bc-serve2').classList.toggle('hidden', serving !== 2);
    if (serving === 1) bcPointCell1.classList.add('serving');
    else bcPointCell2.classList.add('serving');
  }
}

var slidesEditorEl = document.getElementById('slides-editor');
function addSlideRow(src, duration) {
  var row = document.createElement('div');
  row.className = 'slide-row';
  var srcInput = document.createElement('input');
  srcInput.type = 'text';
  srcInput.className = 'slide-src';

  srcInput.addEventListener('input', saveSettings);

// --- Slideshow preview (self-contained; mirrors receiver.js) ---
var previewEl = document.getElementById('slideshow-preview');
var slideshowBgEl = document.getElementById('slideshow');
var slideImgA = document.getElementById('slide-img-a');
var slideImgB = document.getElementById('slide-img-b');
var slideVideoEl = document.getElementById('slide-video');
var previewSlides = [];
var previewIndex = -1;
var previewTimer = null;
var previewActiveImg = null;

function isVideoSrc(src) {
  return /\.(mp4|webm|ogg)$/i.test(src);
}

function collectSlides() {
  var slides = [];
  slidesEditorEl.querySelectorAll('.slide-row').forEach(function(row) {
    var src = row.querySelector('.slide-src').value.trim();
    if (!src) return;
    var dur = Number(row.querySelector('.slide-dur').value);
    slides.push({ src: src, duration: dur > 0 ? dur : 5 });
  });
  return slides;
}

function stopPreview() {
  if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
  try { slideVideoEl.pause(); } catch (e) {}
  slideVideoEl.removeAttribute('src');
  slideVideoEl.classList.add('hidden');
  slideImgA.classList.remove('visible'); slideImgA.removeAttribute('src');
  slideImgB.classList.remove('visible'); slideImgB.removeAttribute('src');
  previewActiveImg = null;
  previewIndex = -1;
  previewEl.classList.add('hidden');
}

function previewNextSlide() {
  if (!previewSlides.length) return;
  previewIndex = (previewIndex + 1) % previewSlides.length;
  var slide = previewSlides[previewIndex];
  if (isVideoSrc(slide.src)) {
    previewShowVideo(slide.src);
  } else {
    previewShowImage(slide.src, slide.duration);
  }
}

function previewShowImage(src, duration) {
  try { slideVideoEl.pause(); } catch (e) {}
  slideVideoEl.classList.add('hidden');

  var nextImg = (previewActiveImg === slideImgA) ? slideImgB : slideImgA;
  var prevImg = previewActiveImg;
  var preload = new Image();
  preload.onload = function() {
    nextImg.src = src;
    requestAnimationFrame(function() {
      nextImg.style.zIndex = '2';
      nextImg.classList.add('visible');
      if (prevImg) { prevImg.style.zIndex = '1'; prevImg.classList.remove('visible'); }
      previewActiveImg = nextImg;
    });
  };
  preload.onerror = function() { previewTimer = setTimeout(previewNextSlide, 1000); };
  preload.src = src;

  if (previewTimer) clearTimeout(previewTimer);
  previewTimer = setTimeout(previewNextSlide, duration * 1000);
}

function previewShowVideo(src) {
  if (previewTimer) { clearTimeout(previewTimer); previewTimer = null; }
  slideImgA.classList.remove('visible');
  slideImgB.classList.remove('visible');
  slideVideoEl.classList.remove('hidden');
  slideVideoEl.src = src;
  slideVideoEl.onended = previewNextSlide;
  slideVideoEl.onerror = function() { previewTimer = setTimeout(previewNextSlide, 1000); };
  try { slideVideoEl.play(); } catch (e) {}
}

function startPreview() {
  previewSlides = collectSlides();
  if (!previewSlides.length) { alert('Add at least one slide to preview.'); return; }
  var bg = document.getElementById('inp-slide-bg').value.trim() || 'black';
  slideshowBgEl.style.backgroundColor = bg;
  previewIndex = -1;
  previewActiveImg = null;
  previewEl.classList.remove('hidden');
  previewNextSlide();
}

document.getElementById('btn-preview').addEventListener('click', startPreview);
previewEl.addEventListener('click', stopPreview);

// --- VS countdown + center ad simulation (mirrors receiver.js) ---
var vsSimAdTimer = null;
var vsSimAdSlides = null;
var vsSimAdIndex = -1;
var vsSimAdActive = null;
var vsSimAdImgEls = null;   // active [imgA, imgB] pair for the current theme
var vsSimCountdownInt = null;

function stopVsSim() {
  if (vsSimAdTimer) { clearTimeout(vsSimAdTimer); vsSimAdTimer = null; }
  if (vsSimCountdownInt) { clearInterval(vsSimCountdownInt); vsSimCountdownInt = null; }
  vsSimAdSlides = null; vsSimAdIndex = -1; vsSimAdActive = null; vsSimAdImgEls = null;
  ['vs-ad-a','vs-ad-b','vs-ad-bc-a','vs-ad-bc-b'].forEach(function(id) {
    var img = document.getElementById(id);
    if (img) { img.classList.remove('visible'); img.removeAttribute('src'); }
  });
  var ad = document.querySelector('.vs-center-ad'); if (ad) ad.classList.add('hidden');
  var bcAd = document.querySelector('.vs-bc-ad'); if (bcAd) bcAd.classList.add('hidden');
  var cd = document.getElementById('vs-countdown'); if (cd) cd.classList.add('hidden');
  var cdTime = document.getElementById('vs-countdown-time'); if (cdTime) cdTime.classList.remove('expired');
  document.getElementById('vs-default-layout').classList.remove('with-ad', 'bc-rails');
  document.getElementById('vs-broadcast-layout').classList.remove('with-ad');
}

function vsSimNextSlide() {
  if (!vsSimAdSlides || !vsSimAdSlides.length || !vsSimAdImgEls) return;
  vsSimAdIndex = (vsSimAdIndex + 1) % vsSimAdSlides.length;
  var slide = vsSimAdSlides[vsSimAdIndex];
  var a = vsSimAdImgEls[0], b = vsSimAdImgEls[1];
  var nextImg = (vsSimAdActive === a) ? b : a;
  var prevImg = vsSimAdActive;
  var preload = new Image();
  preload.onload = function() {
    if (!vsSimAdSlides) return;
    nextImg.src = slide.src;
    requestAnimationFrame(function() {
      nextImg.style.zIndex = '2'; nextImg.classList.add('visible');
      if (prevImg) { prevImg.style.zIndex = '1'; prevImg.classList.remove('visible'); }
      vsSimAdActive = nextImg;
    });
  };
  preload.onerror = function() { if (vsSimAdSlides) vsSimAdTimer = setTimeout(vsSimNextSlide, 1000); };
  preload.src = slide.src;
  if (vsSimAdSlides.length > 1) {
    if (vsSimAdTimer) clearTimeout(vsSimAdTimer);
    vsSimAdTimer = setTimeout(function() { if (vsSimAdSlides) vsSimNextSlide(); }, (slide.duration || 10) * 1000);
  }
}

function startVsSim(isBc) {
  var minutes = Number(document.getElementById('inp-vs-countdown').value);
  if (!(minutes > 0)) return;
  // Countdown bar (both themes)
  var cd = document.getElementById('vs-countdown');
  var cdTime = document.getElementById('vs-countdown-time');
  cd.classList.remove('hidden');
  cdTime.classList.remove('expired');
  var endTs = Date.now() + minutes * 60000;
  function tick() {
    var rem = endTs - Date.now();
    if (rem <= 0) {
      cdTime.textContent = '00:00';
      cdTime.classList.add('expired');
      if (vsSimCountdownInt) { clearInterval(vsSimCountdownInt); vsSimCountdownInt = null; }
      return;
    }
    var t = Math.floor(rem / 1000), m = Math.floor(t / 60), s = t % 60;
    cdTime.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }
  tick();
  vsSimCountdownInt = setInterval(tick, 1000);
  // Ad slideshow — default: side rails + center slot; broadcast: 16:9 slot above shrunk card.
  var layout = document.getElementById(isBc ? 'vs-broadcast-layout' : 'vs-default-layout');
  layout.classList.add('with-ad');
  var images = collectSlides().filter(function(s) { return !isVideoSrc(s.src); });
  if (images.length) {
    vsSimAdImgEls = isBc
      ? [document.getElementById('vs-ad-bc-a'), document.getElementById('vs-ad-bc-b')]
      : [document.getElementById('vs-ad-a'), document.getElementById('vs-ad-b')];
    var container = document.querySelector(isBc ? '.vs-bc-ad' : '.vs-center-ad');
    vsSimAdSlides = images;
    vsSimAdIndex = -1;
    container.classList.remove('hidden');
    vsSimNextSlide();
  }
}

document.getElementById('btn-export').addEventListener('click', function() {

  var textColor = document.getElementById('inp-text-color').value.trim();
  var accentColor = document.getElementById('inp-accent-color').value.trim();
  var slideBg = document.getElementById('inp-slide-bg').value.trim();
  var matchDelay = Number(document.getElementById('inp-match-delay').value);

  if (textColor) data.textColor = textColor;
  if (accentColor) data.textColorAccent = accentColor;
  if (slideBg) data.backgroundColor = slideBg;
  if (matchDelay > 0) data.matchOverDelayMinutes = matchDelay;
  if (vsCountdown > 0) data.vsCountdownMinutes = vsCountdown;
  if (title) data.title = title;
  if (subtitle) data.subtitle = subtitle;
  var slides = [];

    if (dur > 0) slide.duration = dur;
    slides.push(slide);
  });
  if (slides.length) data.slides = slides;
  var blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'playlist.json';
  a.click();
  URL.revokeObjectURL(url);
});

// --- Persistence (survives browser refresh) ---
var STORAGE_KEY = 'ip-cast-mockup-settings';
var PERSIST_FIELDS = [
  'sel-theme','sel-format','sel-serve','sel-point','sel-state',
  'inp-title','inp-subtitle','inp-bg-url','inp-bg-color','inp-sb-color',
  'inp-text-color','inp-accent-color','inp-slide-bg','inp-match-delay','inp-vs-countdown'
];

function saveSettings() {
  var fields = {};
  PERSIST_FIELDS.forEach(function(id) { fields[id] = document.getElementById(id).value; });
  var slides = [];
  slidesEditorEl.querySelectorAll('.slide-row').forEach(function(row) {
    slides.push({ src: row.querySelector('.slide-src').value, dur: row.querySelector('.slide-dur').value });
  });
  var data = { fields: fields, titleBar: document.getElementById('chk-title').checked, slides: slides };
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function loadSettings() {
  var data = null;
  try {
    var raw = localStorage.getItem(STORAGE_KEY);
    if (raw) data = JSON.parse(raw);
  } catch (e) { data = null; }

  if (data && data.fields) {
    PERSIST_FIELDS.forEach(function(id) {
      if (data.fields[id] != null) document.getElementById(id).value = data.fields[id];
    });
  }
  if (data && typeof data.titleBar === 'boolean') {
    document.getElementById('chk-title').checked = data.titleBar;
  }
  if (data && data.slides && data.slides.length) {
    data.slides.forEach(function(s) { addSlideRow(s.src, (s.dur !== '' && s.dur != null) ? s.dur : null); });
  } else {
    addSlideRow();
  }
}

// Save on any control change (selects, text/number inputs, title checkbox)
PERSIST_FIELDS.forEach(function(id) {
  var el = document.getElementById(id);
  el.addEventListener('input', saveSettings);
  el.addEventListener('change', saveSettings);
});
document.getElementById('chk-title').addEventListener('change', saveSettings);

loadSettings();
update();
</script>
</body>
</html>
