<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Infliction Point Cast Receiver</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="receiver.css">
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
</head>
<body>
  <div id="scoreboard" class="hidden">
    <div id="team1" class="team-panel team1-bg">
      <div id="serve1" class="serve-ball hidden"></div>
      <div id="score-container1" class="score-container">
        <div id="points1" class="points">0</div>
      </div>
      <div id="medal1" class="medal hidden"><img src="trophy.svg" class="trophy-img"></div>
      <div id="label1" class="team-label-pill team1-pill">TEAM 1</div>
    </div>
    <div id="badge" class="badge hidden"></div>
    <div id="center-overlay">
      <div id="dots-row" class="dots-row"></div>
      <div id="format-label" class="format-label"></div>
      <div id="score-row-1" class="score-row"></div>
      <div id="score-row-label" class="score-row-label hidden"></div>
      <div id="score-row-2" class="score-row"></div>
      <div id="duration" class="duration-label hidden">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="duration-icon" fill="currentColor">
          <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-20-420v-200h80v160h160v80H460Z"/>
        </svg>
        <span id="current-time-text"></span>
        <span class="duration-separator">·</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="duration-icon" fill="currentColor">
          <path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm-99.5 291.5Q275-137 226-186t-77.5-114.5Q120-366 120-440t28.5-139.5Q177-645 226-694t114.5-77.5Q406-800 480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80q-74 0-139.5-28.5ZM678-242q82-82 82-198t-82-198q-82-82-198-82t-198 82q-82 82-82 198t82 198q82 82 198 82t198-82ZM480-440Z"/>
        </svg>
        <span id="duration-text"></span>
      </div>
    </div>
    <div id="team2" class="team-panel team2-bg">
      <div id="serve2" class="serve-ball hidden"></div>
      <div id="score-container2" class="score-container">
        <div id="points2" class="points">0</div>
      </div>
      <div id="medal2" class="medal hidden"><img src="trophy.svg" class="trophy-img"></div>
      <div id="label2" class="team-label-pill team2-pill">TEAM 2</div>
    </div>
  </div>

  <div id="scoreboard-broadcast" class="hidden">
    <div class="bc-bg-image"></div>
    <div class="bc-bg-overlay"></div>
    <div class="bc-layout">
      <div class="bc-top-row">
        <div id="bc-header" class="bc-header hidden">
          <span id="bc-title" class="bc-title"></span>
        </div>
        <div id="bc-duration" class="bc-duration hidden">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="bc-duration-icon" fill="currentColor">
            <path d="M480-80q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm-20-420v-200h80v160h160v80H460Z"/>
          </svg>
          <span id="bc-current-time-text"></span>
          <span class="bc-duration-separator">·</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -960 960 960" class="bc-duration-icon" fill="currentColor">
            <path d="M360-840v-80h240v80H360Zm80 440h80v-240h-80v240Zm-99.5 291.5Q275-137 226-186t-77.5-114.5Q120-366 120-440t28.5-139.5Q177-645 226-694t114.5-77.5Q406-800 480-800q62 0 119 20t107 58l56-56 56 56-56 56q38 50 58 107t20 119q0 74-28.5 139.5T734-186q-49 49-114.5 77.5T480-80q-74 0-139.5-28.5ZM678-242q82-82 82-198t-82-198q-82-82-198-82t-198 82q-82 82-82 198t82 198q82 82 198 82t198-82ZM480-440Z"/>
          </svg>
          <span id="bc-duration-text"></span>
        </div>
      </div>
      <div class="bc-table-wrapper">
      <div class="bc-table">
        <div class="bc-col-header-row">
          <div class="bc-name-header" id="bc-col-label"></div>
          <div id="bc-set-headers" class="bc-set-headers"></div>
          <div class="bc-point-header">POINT</div>
        </div>
        <div class="bc-divider"></div>
        <div id="bc-row1" class="bc-row">
          <div id="bc-strip1" class="bc-team-strip team1"></div>
          <div id="bc-names1" class="bc-names-cell"></div>
          <div id="bc-serve1" class="bc-serve-ball hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69.447 69.447"><path fill="var(--bc-accent-color, #D5FB28)" d="M69.439,34.724a34.719,34.719 0,1 1,-34.72 -34.724A34.724,34.724 0,0 1,69.439 34.724Z"/><path fill="#F7F7F7" d="M39.375,0.345a35.139,35.139 0,0 0,-4.61 -0.344,41.069 41.069,0 0,1 -34.369,29.735 34.3,34.3 0,0 0,-0.381 4.635l0.183,-0.026A45.921,45.921 0,0 0,39.347 0.464ZM69.096,35.037a45.487,45.487 0,0 0,-33.488 34.054l-0.071,0.313a34.54,34.54 0,0 0,4.818 -0.455,41.218 41.218,0 0,1 28.686,-29.194 36.059,36.059 0,0 0,0.388 -4.8Z"/></svg></div>
          <div id="bc-sets1" class="bc-sets-cell"></div>
          <div id="bc-point-cell1" class="bc-point-cell">
            <div id="bc-trophy1" class="bc-trophy hidden"><img src="trophy.svg" class="trophy-img"></div>
            <div id="bc-star1" class="bc-star hidden">★</div>
            <span id="bc-points1" class="bc-points"></span>
          </div>
        </div>
        <div class="bc-divider"></div>
        <div id="bc-row2" class="bc-row">
          <div id="bc-strip2" class="bc-team-strip team2"></div>
          <div id="bc-names2" class="bc-names-cell"></div>
          <div id="bc-serve2" class="bc-serve-ball hidden"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 69.447 69.447"><path fill="var(--bc-accent-color, #D5FB28)" d="M69.439,34.724a34.719,34.719 0,1 1,-34.72 -34.724A34.724,34.724 0,0 1,69.439 34.724Z"/><path fill="#F7F7F7" d="M39.375,0.345a35.139,35.139 0,0 0,-4.61 -0.344,41.069 41.069,0 0,1 -34.369,29.735 34.3,34.3 0,0 0,-0.381 4.635l0.183,-0.026A45.921,45.921 0,0 0,39.347 0.464ZM69.096,35.037a45.487,45.487 0,0 0,-33.488 34.054l-0.071,0.313a34.54,34.54 0,0 0,4.818 -0.455,41.218 41.218,0 0,1 28.686,-29.194 36.059,36.059 0,0 0,0.388 -4.8Z"/></svg></div>
          <div id="bc-sets2" class="bc-sets-cell"></div>
          <div id="bc-point-cell2" class="bc-point-cell">
            <div id="bc-trophy2" class="bc-trophy hidden"><img src="trophy.svg" class="trophy-img"></div>
            <div id="bc-star2" class="bc-star hidden">★</div>
            <span id="bc-points2" class="bc-points"></span>
          </div>
        </div>
        <div class="bc-divider"></div>
      </div>
      <div id="bc-badge" class="bc-badge hidden"></div>
      </div>
    </div>
  </div>

  <div id="vs-screen" class="hidden">
    <div id="vs-default-layout" class="hidden">
      <div class="vs-panel vs-panel-team1">
        <div id="vs-names1-default" class="vs-names"></div>
      </div>
      <div class="vs-center-default">
        <span class="vs-label-default">VS</span>
      </div>
      <div class="vs-panel vs-panel-team2">
        <div id="vs-names2-default" class="vs-names"></div>
      </div>
    </div>
    <div id="vs-broadcast-layout" class="hidden">
      <div class="bc-bg-image"></div>
      <div class="bc-bg-overlay"></div>
      <div class="vs-bc-outer">
        <div id="vs-bc-header" class="bc-header hidden">
          <span id="vs-bc-title" class="bc-title"></span>
          <span id="vs-bc-subtitle" class="vs-bc-subtitle"></span>
        </div>
      <div class="vs-bc-layout">
        <div class="vs-bc-team">
          <div class="bc-team-strip team1"></div>
          <div id="vs-names1-broadcast" class="vs-bc-names"></div>
        </div>
        <div class="vs-bc-vs">VS</div>
        <div class="vs-bc-team">
          <div class="bc-team-strip team2"></div>
          <div id="vs-names2-broadcast" class="vs-bc-names"></div>
        </div>
      </div>
      </div>
    </div>
  </div>

  <div id="idle">
    <div id="idle-default" class="idle-content">
      <img src="../images/logo.png" alt="Infliction Point" class="idle-logo-img">
    </div>
    <div id="slideshow" class="hidden">
      <img id="slide-img-a" class="slide-img">
      <img id="slide-img-b" class="slide-img">
      <cast-media-player id="player" class="hidden"></cast-media-player>
    </div>
  </div>

  <script src="receiver.js"></script>
</body>
</html>
